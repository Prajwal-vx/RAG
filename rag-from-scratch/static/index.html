<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG From Scratch</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="paper-field" aria-hidden="true">
    <svg class="paper p1" viewBox="0 0 100 130"><rect x="2" y="2" width="96" height="126" rx="4"/><path d="M2 2 L98 2 L98 128 L2 128 Z" class="fold"/><line x1="16" y1="34" x2="84" y2="34"/><line x1="16" y1="50" x2="84" y2="50"/><line x1="16" y1="66" x2="70" y2="66"/><line x1="16" y1="82" x2="84" y2="82"/><line x1="16" y1="98" x2="60" y2="98"/></svg>
    <svg class="paper p2" viewBox="0 0 100 130"><rect x="2" y="2" width="96" height="126" rx="4"/><path d="M70 2 L98 30 L70 30 Z" class="dogear"/><line x1="16" y1="46" x2="84" y2="46"/><line x1="16" y1="62" x2="84" y2="62"/><line x1="16" y1="78" x2="55" y2="78"/></svg>
    <svg class="paper p3" viewBox="0 0 100 130"><rect x="2" y="2" width="96" height="126" rx="4"/><text x="50" y="40" text-anchor="middle" class="pdf-tag">PDF</text><line x1="16" y1="60" x2="84" y2="60"/><line x1="16" y1="76" x2="84" y2="76"/><line x1="16" y1="92" x2="65" y2="92"/></svg>
    <svg class="paper p4" viewBox="0 0 100 130"><rect x="2" y="2" width="96" height="126" rx="4"/><path d="M70 2 L98 30 L70 30 Z" class="dogear"/><line x1="16" y1="46" x2="84" y2="46"/><line x1="16" y1="62" x2="72" y2="62"/></svg>
    <svg class="paper p5" viewBox="0 0 100 130"><rect x="2" y="2" width="96" height="126" rx="4"/><text x="50" y="40" text-anchor="middle" class="pdf-tag">PDF</text><line x1="16" y1="60" x2="84" y2="60"/><line x1="16" y1="76" x2="60" y2="76"/></svg>
    <svg class="paper p6" viewBox="0 0 100 130"><rect x="2" y="2" width="96" height="126" rx="4"/><line x1="16" y1="34" x2="84" y2="34"/><line x1="16" y1="50" x2="84" y2="50"/><line x1="16" y1="66" x2="70" y2="66"/><line x1="16" y1="82" x2="84" y2="82"/></svg>
    <svg class="paper p7" viewBox="0 0 100 130"><rect x="2" y="2" width="96" height="126" rx="4"/><path d="M70 2 L98 30 L70 30 Z" class="dogear"/><line x1="16" y1="46" x2="84" y2="46"/><line x1="16" y1="62" x2="84" y2="62"/><line x1="16" y1="78" x2="50" y2="78"/></svg>
    <svg class="paper p8" viewBox="0 0 100 130"><rect x="2" y="2" width="96" height="126" rx="4"/><text x="50" y="40" text-anchor="middle" class="pdf-tag">PDF</text><line x1="16" y1="60" x2="84" y2="60"/><line x1="16" y1="76" x2="84" y2="76"/></svg>
  </div>
  <div class="shell">
    <header>
      <div>
        <span class="eyebrow">RETRIEVAL-AUGMENTED GENERATION</span>
        <h1>RAG From Scratch</h1>
        <p>Upload documents. Search them semantically. Get grounded answers.</p>
      </div>
      <div id="status" class="status">Checking system...</div>
    </header>

    <main>
      <aside class="panel">
        <h2>Knowledge Base</h2>
        <label class="upload">
          <input id="fileInput" type="file" accept=".pdf,.txt,.md,.docx" />
          <span>+ Upload Document</span>
        </label>
        <div id="uploadMessage"></div>
        <div id="documents" class="documents"></div>
      </aside>

      <section class="chat panel">
        <div id="messages" class="messages">
          <div class="message assistant">
            <div class="bubble">
              Upload one or more documents, then ask me a question. I will retrieve relevant chunks before answering.
            </div>
          </div>
        </div>

        <form id="chatForm">
          <textarea id="question" placeholder="Ask something about your indexed documents..." rows="2"></textarea>
          <button id="sendButton" type="submit">Send</button>
        </form>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
